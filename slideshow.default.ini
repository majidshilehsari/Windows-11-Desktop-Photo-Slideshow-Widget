; ------------------------------------------------------------------
;  Desktop Photo Slideshow - settings (portable: lives next to the .exe)
;  Everything here can also be changed from the tray icon menu or the
;  Settings dialog.  After editing this file: tray menu -> Reload.
; ------------------------------------------------------------------
[
; folder with your pictures; leave it empty to use your Pictures folder
path = ''

; ---- images ----
recursive = 1                       ; also look inside subfolders
extensions = .jpg;.jpeg;.png;.bmp;.gif;.tif;.tiff;.webp
sort_desc = 0                       ; 1 = newest file first
shuffle = 1                         ; random order each start
repeat = 1                          ; 0 = stop after one pass
min_side = 160                      ; ignore smaller images (0 = off)
exif_auto_rotate = 0                ; set 1 if photos show sideways

; ---- timing ----
interval_s = 30                     ; seconds per photo
random_interval = 0                 ; vary the interval a bit
random_jitter = 30                  ; +/- percent
transition_ms = 900                 ; crossfade length (0 = hard cut)

; ---- motion (Ken Burns) ----
anim = zoom                         ; none | zoom | pan
anim_zoom = 1.10                    ; 1.00 - 2.00
anim_alt = 1                        ; alternate zoom in / zoom out
anim_fps = 0                        ; 0 = only animate during a transition (quiet CPU)

; ---- geometry & look ----
half_screen = 0                     ; 1 = cover exactly half of the screen
left = 0
top = 0
width = 0
height = 0
corner = 12                         ; rounded corners, px (0 = square)
shadow = 18                         ; soft drop shadow, px (0 = none)
border = 1                          ; hairline around the picture
border_alpha = 26                   ; 0 - 255
bg = #0B0F14                        ; colour behind transparent areas
fit = cover                         ; cover | contain | stretch

; ---- caption ----
caption = 1
caption_fmt = {name}  ·  {i}/{n}    ; {name} {folder} {path} {i} {n} {time} {date}
caption_size = 15
caption_font = Segoe UI
caption_h = 40
caption_alpha = 235
caption_hover_only = 0              ; 1 = only show the name while the pointer is over it

; ---- behaviour ----
click_through = 1                   ; clicks pass straight through to the desktop
auto_bottom = 1                     ; keep it glued to the desktop layer
topmost = 0                         ; 1 = float above every window instead
pause_when_fullscreen = 1           ; hold still while a game / presentation runs
pause_on_lock = 1
auto_start = 0                      ; Start with Windows (toggled in the menu too)
show_in_taskbar = 0
hotkeys = auto                      ; auto | none  (Ctrl+Alt+W/P/left/right)
log = 0                             ; 1 = write slideshow.log next to the .exe

; ---- edit mode ----
edit = 0                            ; 1 = start ready to drag / resize
edit_border_alpha = 190
show_grip = 1                       ; small handle in the corner that stays clickable
grip_size = 26
