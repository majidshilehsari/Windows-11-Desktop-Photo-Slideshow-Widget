name: Build Windows exe

# Two ways to get an .exe out of this repo:
#   1) push a tag like v1.0.0 (or publish a release) -> a build is attached to it
#   2) Actions -> "Build Windows exe" -> Run workflow  -> artefact under "Summary"
#
# To install this file, copy it to .github/workflows/build-windows.yml on GitHub
# (a bot / GitHub-App token is not allowed to push into .github/workflows), or run
# build/enable-actions.ps1 from a machine where `gh` is logged in as you.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version baked into the exe (e.g. 0.1.0)
        default: auto
        type: string
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    name: MSYS2 / MinGW-w64
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v) -or $v -eq 'auto') {
            if ('${{ github.ref_name }}' -like 'v*') { $v = ('${{ github.ref_name }}').Substring(1) } else { $v = '0.1.0' }
          }
          if ($v -notmatch '^\d+(\.\d+){0,3}$') { $v = '0.1.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "built<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          (Get-Date -Format 'yyyy-MM-dd HH:mm z') | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Scripts are ASCII only
        shell: msys2 {0}
        run: |
          if grep -nP "[^\x00-\x7F]" build/build.ps1 build/build.cmd >/dev/null 2>&1; then
            echo "build script contains non-ASCII bytes: Windows PowerShell 5.1 would read them as ANSI"
            echo "and the file would fail to parse.  Keep build/*.ps1 and build/*.cmd English/ASCII."
            exit 1
          fi
          echo "build scripts are pure ASCII"

      - name: Compile
        shell: msys2 {0}
        run: |
          set -o pipefail
          export PATH=/mingw64/bin:$PATH
          gcc --version | head -1
          export DSKV_VERSION="${{ steps.ver.outputs.version }}"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./build/build.ps1
          ls -l dist

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-slideshow-${{ steps.ver.outputs.version }}-win-x64
          path: |
            dist/desktop-slideshow.exe
            dist/*.zip
            dist/*SHA256.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Portable Windows 11 desktop photo-slideshow widget.

            * `desktop-slideshow-<version>-win-x64-portable.zip` - **this is the one to use**: extract to a normal folder (not the archive preview window), run `desktop-slideshow.exe`, tweak `slideshow.ini` next to it.
            * `desktop-slideshow.exe` - the bare executable (~420 KB).
            * No installer, no .NET / VC++ runtime, no admin rights.

            First run: right-click the tray icon -> **Choose folder**, drag the picture into place
            (Edit mode / `Ctrl+Alt+W`), then tick **Start with Windows**.
          files: |
            dist/*-win-x64-portable.zip
            dist/desktop-slideshow.exe
            dist/*SHA256.txt
